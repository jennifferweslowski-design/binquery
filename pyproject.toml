[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binquery"
version = "0.1.0"
description = "Local CLI: index a video folder and shortlist clips by editing intent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dylan Xu" }]
dependencies = [
  "open_clip_torch",
  "torch",
  "numpy",
  "pillow",
  "opencv-python-headless",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
binquery = "binquery.cli:main"

[project.urls]
Homepage = "https://github.com/jennifferweslowski-design/binquery"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["binquery*"]
