name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install binquery (CPU torch)
        run: |
          python -m pip install -U pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
          pip install --force-reinstall --no-deps torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Unit tests
        run: python -m pytest -q

      - name: lavfi split then index then doctor
        env:
          BINQUERY_CLIP_CACHE: ${{ runner.temp }}/clip-cache
        run: |
          set -euo pipefail
          LONG="${RUNNER_TEMP}/bq-long/long.mp4"
          SPLIT="${RUNNER_TEMP}/bq-split"
          BOX="${RUNNER_TEMP}/bq-box"
          mkdir -p "$(dirname "$LONG")"
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=30:size=320x240:rate=25 \
            -f lavfi -i sine=frequency=440:duration=30 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            "$LONG"
          binquery split --input "$LONG" --out "$SPLIT" --seconds 8
          n="$(find "$SPLIT" -maxdepth 1 -type f | wc -l)"
          if [ "$n" -lt 2 ]; then
            echo "expected >=2 split outputs, got $n" >&2
            exit 1
          fi
          binquery index --input "$SPLIT" --index "$BOX"
          binquery doctor --index "$BOX"
          OUT="$BOX/query_smoke.json"
          binquery query --index "$BOX" "color test pattern" --out "$OUT"
          python - "$OUT" "$BOX/index/clip.json" <<'PY'
          import json
          import pathlib
          import sys

          doc = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          clip = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert isinstance(doc, dict), "top level is not an object"
          assert "results" in doc, "missing 'results' key"
          results = doc["results"]
          assert isinstance(results, list), "'results' is not a list"
          assert results, "pictorial query returned no results"
          expected = {
              "path",
              "score",
              "gate",
              "reasons",
              "clip_score",
              "duration_sec",
              "best_frame",
              "best_time_sec",
              "duration_bonus",
          }
          assert all(expected <= set(row) for row in results), "result fields are incomplete"
          indexed = {row["filename"] for row in clip.get("frames", [])}
          assert all(row["path"] in indexed for row in results), "result path is not in index"
          scores = [row["score"] for row in results]
          assert scores == sorted(scores, reverse=True), "not ordered by score descending"
          PY
